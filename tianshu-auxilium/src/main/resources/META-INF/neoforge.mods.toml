modLoader="javafml"
loaderVersion="[1,)"
license="MIT"

[[mods]]
modId="tianshu"
version="${mod_version}"
displayName="${mod_name}"
logoFile="icon.png"
description='''
Dialogue brain for Tianshu: turn orchestration, memory, and game-event context.
'''
displayTest="IGNORE_SERVER_VERSION"

[[dependencies.tianshu]]
    modId="neoforge"
    type="required"
    versionRange="[1,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.tianshu]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.tianshu]]
    modId="tianshu_ferry"
    type="required"
    versionRange="[1.0.0,2.0.0)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.tianshu]]
    modId="tianshu_foundry"
    type="required"
    versionRange="${tianshu_foundry_version_range}"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.tianshu]]
    modId="tianshu_presence"
    type="required"
    versionRange="[${mod_version},)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.tianshu]]
modId="tianshu_intake"
type="optional"
versionRange="[${mod_version},)"
ordering="NONE"
side="CLIENT"

[[dependencies.tianshu]]
modId="tianshu_weaving"
type="required"
versionRange="[${mod_version},)"
ordering="NONE"
side="CLIENT"

[[dependencies.tianshu]]
modId="tianshu_echo"
type="optional"
versionRange="[${mod_version},)"
ordering="NONE"
side="CLIENT"
