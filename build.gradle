plugins {
    id 'java-library'
}

version = mod_version
group = mod_group_id

java.toolchain.languageVersion = JavaLanguageVersion.of((findProperty('java_version') ?: '21') as int)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ---------------------------------------------------------------- boundary gates
// These rules span modules, so they live at the root instead of inside one of them.
//
// Payload/dependency rule (full text: doc/architecture/模块拆分工程方案.md §9.7):
//   1. a payload class belongs to the module that produces it (protocol base payloads: tianshu-api);
//   2. a REQUIRED partner -> hard dependency, plain import, no guard;
//   3. an OPTIONAL partner -> compileOnly, and the partner's classes may only be touched from a `bridge`
//      package loaded behind InstalledMods.isLoaded(...);
//   4. the kernel (core/client/adapter) referencing a payload at all is the only reason it belongs in api —
//      never move a feature payload into api just to avoid writing a guard.

def featureModules = ['tianshu-intake', 'tianshu-echo', 'tianshu-weaving', 'tianshu-auxilium']
def neutralModules = featureModules + ['tianshu-api', 'tianshu-core', 'tianshu-client', 'tianshu-testkit']

// Feature modules relate to each other in exactly two ways, and the difference is a product statement:
//   required — the consumer is not functional without it: a hard dependency, classes always visible,
//              no optionality code at all.
//   optional — "integrate when present": compileOnly plus a runtime presence guard.
//   auxilium -> intake/weaving (required), echo (optional)
//   intake   -> weaving/echo (optional)
// A two-way protocol cannot be split between two optional partners: exactly one module owns the
// vocabulary and the other depends on it. Dialogue is two-way (delivery flows down, participant and
// session control flow up), so intake owns it and auxilium requires intake.
//   weaving, echo are leaves
def requiredFeatureEdges = [
        'auxilium': ['intake', 'weaving'],
        'intake'  : [],
        'weaving' : [],
        'echo'    : [],
]
def optionalFeatureEdges = [
        'auxilium': ['echo'],
        'intake'  : ['weaving', 'echo'],
        'weaving' : [],
        'echo'    : [],
]
def allowedFeatureEdges = [:]
featureModules.each { module ->
    def owner = module - 'tianshu-'
    allowedFeatureEdges[owner] = ((requiredFeatureEdges[owner] ?: []) + (optionalFeatureEdges[owner] ?: [])).unique()
}
// Shipped kernel modules. tianshu-testkit is not one: it is a dev-only fixtures artifact that never enters
// a mod jar, so it is allowed to speak the feature modules' vocabulary on purpose.
def hostModules = ['tianshu-api', 'tianshu-core', 'tianshu-client', 'tianshu-adapter']

tasks.register('verifyFeatureIsolation') {
    group = 'verification'
    description = 'Feature modules may only reference each other along the declared optional edges.'
    inputs.files(files(featureModules.collect { "${it}/src/main/java" }))
    doLast { task ->
        def names = featureModules.collect { it - 'tianshu-' } as Set
        def violations = []
        task.inputs.files.files.each { source ->
            if (!source.path.endsWith('.java')) return
            def path = source.path.replace('\\', '/')
            def ownerMatch = path =~ /tianshu-([a-z]+)\/src\/main\/java/
            if (!ownerMatch.find()) return
            def owner = ownerMatch.group(1)
            if (!(owner in names)) return
            def allowed = allowedFeatureEdges[owner] ?: []
            source.eachLine('UTF-8') { line ->
                def m = line.trim() =~ /^import com\.rheinmetal\.tianshu\.function\.(intake|echo|weaving|auxilium)\./
                if (m.find() && m.group(1) != owner && !(m.group(1) in allowed)) {
                    violations << "${source.name}: ${owner} -> ${m.group(1)} is not an allowed edge: ${line.trim()}"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Illegal cross-feature imports:\n" + violations.join('\n'))
        }
    }
}

tasks.register('verifyFeatureOptionalDependencies') {
    group = 'verification'
    description = 'Required edges are hard dependencies, optional edges are compileOnly, and nothing else exists.'
    def buildFiles = featureModules.collectEntries { module ->
        [(module): file("${module}/build.gradle")]
    }
    def sourcesByModule = featureModules.collectEntries { module ->
        [(module): fileTree("${module}/src/main/java") { include '**/*.java' }.files]
    }
    def modsTomlByModule = featureModules.collectEntries { module ->
        [(module): fileTree("${module}/src") { include '**/neoforge.mods.toml' }.files]
    }
    inputs.files(buildFiles.values())
    inputs.files(sourcesByModule.values().flatten())
    inputs.files(modsTomlByModule.values().flatten())
    doLast {
        def violations = []
        featureModules.each { module ->
            def owner = module - 'tianshu-'
            def buildFile = buildFiles[module]
            if (!buildFile.exists()) return
            def text = buildFile.text
            def sources = sourcesByModule[module]
            def tomlText = (modsTomlByModule[module] ?: []).collect { it.text }.join('\n')
            def required = requiredFeatureEdges[owner] ?: []
            def optional = optionalFeatureEdges[owner] ?: []
            (required + optional).each { target ->
                def marker = "import com.rheinmetal.tianshu.function.${target}."
                def used = sources.any { candidate -> candidate.text.contains(marker) }
                if (!used) return
                def hardDeclaration = text.contains("api project(':tianshu-${target}')")
                        || text.contains("implementation project(':tianshu-${target}')")
                def optionalDeclaration = text.contains("compileOnly project(':tianshu-${target}')")
                def expectedType = target in required ? 'required' : 'optional'
                if (target in required && !hardDeclaration) {
                    violations << "${module} requires tianshu-${target} but does not declare it as a hard dependency"
                }
                if (target in optional && !optionalDeclaration) {
                    violations << "${module} integrates with tianshu-${target} but does not declare it as compileOnly"
                }
                // The loader has to know the same thing the build does, or load order and the "missing mod"
                // message disagree with what the code actually assumes.
                def modId = "tianshu_${target}"
                def declared = tomlText =~ /modId\s*=\s*"${modId}"\s*\n\s*type\s*=\s*"(\w+)"/
                if (!declared.find()) {
                    violations << "${module} does not declare ${modId} in neoforge.mods.toml"
                } else if (declared.group(1) != expectedType) {
                    violations << "${module} declares ${modId} as ${declared.group(1)} but it is ${expectedType}"
                }
            }
            (text =~ /(api|implementation) project\(':tianshu-(intake|echo|weaving|auxilium)'\)/).each { match ->
                if (!(match[2] in required)) {
                    violations << "${module} declares a hard dependency on tianshu-${match[2]}, which is only an optional integration"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Feature dependency declarations are wrong:\n" + violations.join('\n'))
        }
    }
}

tasks.register('verifyHostHasNoFeatureDependency') {
    group = 'verification'
    description = 'The kernel modules must never reference or depend on a feature module.'
    def hostBuildFiles = hostModules.collectMany { module ->
        def dir = module == 'tianshu-adapter' ? 'tianshu-adapter/neoforge-1.21.1' : module
        [file("${dir}/build.gradle")]
    }
    inputs.files(files(hostModules.collect { "${it}/src/main/java" }))
    inputs.files(hostBuildFiles)
    doLast { task ->
        // A source-free build dependency is the same coupling in a different place: it is what makes the
        // kernel fail to build when a feature jar is removed, even though no import says so.
        hostBuildFiles.each { buildFile ->
            if (!buildFile.exists()) return
            (buildFile.text =~ /(api|implementation|compileOnly) project\(':tianshu-(intake|echo|weaving|auxilium)'\)/).each { match ->
                throw new GradleException("${buildFile} declares a dependency on tianshu-${match[2]}; the kernel must not depend on a feature module")
            }
        }
        def violations = []
        task.inputs.files.files.each { source ->
            if (!source.path.endsWith('.java')) return
            source.eachLine('UTF-8') { line ->
                if (line.trim() =~ /^import com\.rheinmetal\.tianshu\.function\.(intake|echo|weaving|auxilium)\./) {
                    violations << "${source.name}: ${line.trim()}"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Kernel modules reference feature modules:\n" + violations.join('\n'))
        }
    }
}

tasks.register('verifyNoPlatformImport') {
    group = 'verification'
    description = 'Rejects Minecraft/NeoForge imports outside the platform adapter.'
    inputs.files(files(neutralModules.collect { "${it}/src/main/java" }))
    doLast { task ->
        def forbidden = ['net.minecraft.', 'net.neoforged.', 'org.lwjgl.', 'com.mojang.blaze3d.']
        task.inputs.files.files.each { source ->
            if (!source.path.endsWith('.java')) return
            source.eachLine('UTF-8') { line ->
                if (forbidden.any { prefix -> line.trim().startsWith("import ${prefix}") }) {
                    throw new GradleException("${source} imports a forbidden platform package: ${line.trim()}")
                }
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyFeatureIsolation')
    dependsOn tasks.named('verifyFeatureOptionalDependencies')
    dependsOn tasks.named('verifyHostHasNoFeatureDependency')
    dependsOn tasks.named('verifyNoPlatformImport')
}

// ---------------------------------------------------------------- test concurrency
// Compiles stay parallel; test tasks run one at a time. Several suites drive real threads and
// wall-clock attention windows (protocol flows, audio device stubs), so letting six module test JVMs
// compete for the CPU turns them into flakes: they pass alone and time out in a full `check`. One
// shared service with a single usage slot serialises them; the configuration has to reach the
// subprojects, because the root project has no Test task of its own.
def testSerialService = gradle.sharedServices.registerIfAbsent('tianshuTestSerial', org.gradle.api.services.BuildService) {
    maxParallelUsages = 1
}

allprojects {
    tasks.withType(Test).configureEach {
        usesService(testSerialService)
        maxParallelForks = 1
    }
}
