plugins {
    id 'java-library'
}

version = mod_version
group = mod_group_id

java.toolchain.languageVersion = JavaLanguageVersion.of((findProperty('java_version') ?: '21') as int)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ---------------------------------------------------------------- boundary gates
// These rules span modules, so they live at the root instead of inside one of them.
//
// Payload/dependency rule (full text: doc/architecture/模块架构.md §5):
//   1. a payload class belongs to the module that produces it (protocol base payloads: tianshu-api);
//   2. a REQUIRED partner -> hard dependency, plain import, no guard;
//   3. an OPTIONAL partner -> compileOnly, and the partner's classes may only be touched from a `bridge`
//      package loaded behind InstalledMods.isLoaded(...);
//   4. the kernel (core/client/adapter) referencing a payload at all is the only reason it belongs in api —
//      never move a feature payload into api just to avoid writing a guard.

def featureModules = ['tianshu-intake', 'tianshu-echo', 'tianshu-weaving', 'tianshu-auxilium', 'tianshu-presence']
def neutralModules = featureModules + ['tianshu-api', 'tianshu-core', 'tianshu-client', 'tianshu-testkit']

// A pair of feature modules is in exactly one of three states, and the difference is a product statement:
//   required — the consumer is not functional without it: a hard dependency, classes always visible,
//              no optionality code at all.
//   optional — "integrate when present": compileOnly plus a runtime presence guard.
//   none     — no relation at all: no Gradle dependency, no manifest entry, no gate permission. This is
//              the default; an edge exists only because it is listed below.
//   auxilium -> weaving (required), intake/echo (optional)
//   intake, weaving, echo are leaves
// Dialogue is two-way (delivery flows down, participant and session control flow up) but all of its
// vocabulary lives on the intake side: intake imports nothing from auxilium, so the dependency stays
// one-directional and no cycle forms. That edge is required today because without intake nothing delivers
// dialogue to auxilium at all; making it optional needs a bridge over the 12 files that use those types.
def requiredFeatureEdges = [
        'auxilium': ['weaving', 'presence'],
        'intake'  : ['presence'],
        'weaving' : [],
        'echo'    : [],
        'presence': [],
]
def optionalFeatureEdges = [
        'auxilium': ['intake', 'echo'],
        'intake'  : [],
        'weaving' : ['presence'],
        'echo'    : ['presence'],
        'presence': [],
]
def allowedFeatureEdges = [:]
featureModules.each { module ->
    def owner = module - 'tianshu-'
    allowedFeatureEdges[owner] = ((requiredFeatureEdges[owner] ?: []) + (optionalFeatureEdges[owner] ?: [])).unique()
}
// The adapter reads this same matrix when it decides what a development run installs, so the run set and
// the dependency truth cannot drift apart.
ext.requiredFeatureEdges = requiredFeatureEdges
ext.optionalFeatureEdges = optionalFeatureEdges
// Shipped kernel modules. tianshu-testkit is not one: it is a dev-only fixtures artifact that never enters
// a mod jar, so it is allowed to speak the feature modules' vocabulary on purpose.
def hostModules = ['tianshu-api', 'tianshu-core', 'tianshu-client', 'tianshu-adapter']

tasks.register('verifyFeatureIsolation') {
    group = 'verification'
    description = 'Feature modules may only reference each other along the declared optional edges.'
    inputs.files(files(featureModules.collect { "${it}/src/main/java" }))
    doLast { task ->
        def names = featureModules.collect { it - 'tianshu-' } as Set
        def violations = []
        task.inputs.files.files.each { source ->
            if (!source.path.endsWith('.java')) return
            def path = source.path.replace('\\', '/')
            def ownerMatch = path =~ /tianshu-([a-z]+)\/src\/main\/java/
            if (!ownerMatch.find()) return
            def owner = ownerMatch.group(1)
            if (!(owner in names)) return
            def allowed = allowedFeatureEdges[owner] ?: []
            source.eachLine('UTF-8') { line ->
                def m = line.trim() =~ /^import com\.rheinmetal\.tianshu\.function\.(intake|echo|weaving|auxilium|presence)\./
                if (m.find() && m.group(1) != owner && !(m.group(1) in allowed)) {
                    violations << "${source.name}: ${owner} -> ${m.group(1)} is not an allowed edge: ${line.trim()}"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Illegal cross-feature imports:\n" + violations.join('\n'))
        }
    }
}

tasks.register('verifyFeatureOptionalDependencies') {
    group = 'verification'
    description = 'The matrix is the whole truth: every listed edge is declared in Gradle and both manifests, every edge is used, and nothing undeclared exists.'
    def buildFiles = featureModules.collectEntries { module ->
        [(module): file("${module}/build.gradle")]
    }
    def sourcesByModule = featureModules.collectEntries { module ->
        [(module): fileTree("${module}/src/main/java") { include '**/*.java' }.files]
    }
    def modsTomlByModule = featureModules.collectEntries { module ->
        [(module): fileTree("${module}/src") { include '**/neoforge.mods.toml' }.files]
    }
    def fabricManifestByModule = featureModules.collectEntries { module ->
        [(module): file("${module}/src/main/resources/fabric.mod.json")]
    }
    // The package roots each module owns, read from where its sources live. Package name and module name do
    // not always match: the arbitration module ships inside intake as `function.ia`, so usage has to be
    // detected against what the target module actually owns.
    def packagesByModule = featureModules.collectEntries { module ->
        def root = file("${module}/src/main/java/com/rheinmetal/tianshu/function")
        [(module): root.isDirectory() ? root.listFiles().findAll { it.isDirectory() }*.name : []]
    }
    inputs.files(buildFiles.values())
    inputs.files(sourcesByModule.values().flatten())
    inputs.files(modsTomlByModule.values().flatten())
    inputs.files(fabricManifestByModule.values())
    doLast {
        def violations = []
        def shortNames = featureModules.collect { it - 'tianshu-' } as Set
        featureModules.each { module ->
            def owner = module - 'tianshu-'
            def buildFile = buildFiles[module]
            if (!buildFile.exists()) return
            def text = buildFile.text
            def sources = sourcesByModule[module]
            def tomlText = (modsTomlByModule[module] ?: []).collect { it.text }.join('\n')
            def fabricManifest = fabricManifestByModule[module]
            def fabricText = fabricManifest != null && fabricManifest.exists() ? fabricManifest.text : ''
            // Parsed rather than pattern-matched: the version placeholders are ordinary JSON strings, and a
            // regex over the object body trips on the brace inside ${mod_version}.
            def fabricJson = fabricText ? new groovy.json.JsonSlurper().parseText(fabricText) : [:]
            def required = requiredFeatureEdges[owner] ?: []
            def optional = optionalFeatureEdges[owner] ?: []
            def allowed = ((required + optional).unique()) as Set
            (required + optional).each { target ->
                // Usage is detected against the packages the target module actually owns: package name and
                // module name are not the same thing (the arbitration module ships inside intake as
                // `function.ia`), so matching on the module name alone would misreport auxilium -> intake.
                // The key is coerced to String because an interpolated Groovy string is a GString, whose
                // hashCode differs from String's and therefore never matches a map key.
                def used = packagesByModule[("tianshu-" + target)].any { pkg ->
                    def importPrefix = "import com.rheinmetal.tianshu.function.${pkg}."
                    sources.any { candidate -> candidate.text.contains(importPrefix) }
                }
                // An edge nobody uses is a promise the code does not keep. The matrix has to describe
                // relations that exist, not relations that were once planned.
                if (!used) {
                    violations << "${module} lists an edge to tianshu-${target}, but none of its sources uses that module"
                    return
                }
                def hardDeclaration = text.contains("api project(':tianshu-${target}')")
                        || text.contains("implementation project(':tianshu-${target}')")
                def optionalDeclaration = text.contains("compileOnly project(':tianshu-${target}')")
                def expectedType = target in required ? 'required' : 'optional'
                if (target in required && !hardDeclaration) {
                    violations << "${module} requires tianshu-${target} but does not declare it as a hard dependency"
                }
                if (target in optional && !optionalDeclaration) {
                    violations << "${module} integrates with tianshu-${target} but does not declare it as compileOnly"
                }
                // The loader has to know the same thing the build does, or load order and the "missing mod"
                // message disagree with what the code actually assumes.
                // Coerced to String deliberately: an interpolated Groovy string is a GString, whose hashCode
                // differs from String's, so using one as a map key silently never matches a parsed key.
                def modId = "tianshu_${target}".toString()
                def declared = tomlText =~ /modId\s*=\s*"${modId}"\s*\n\s*type\s*=\s*"(\w+)"/
                if (!declared.find()) {
                    violations << "${module} does not declare ${modId} in neoforge.mods.toml"
                } else if (declared.group(1) != expectedType) {
                    violations << "${module} declares ${modId} as ${declared.group(1)} but it is ${expectedType}"
                }
                // The module jars are universal: one artifact carries both manifests, so the same edge has
                // to be told to Fabric too. A missing required declaration there installs a module whose
                // hard dependency is absent, and the only symptom is a NoClassDefFoundError at runtime.
                def fabricRequired = (fabricJson.depends ?: [:]).containsKey(modId)
                def fabricSuggested = (fabricJson.suggests ?: [:]).containsKey(modId)
                if (expectedType == 'required' && !fabricRequired) {
                    violations << "${module} does not require ${modId} in fabric.mod.json"
                }
                if (expectedType == 'required' && fabricSuggested) {
                    violations << "${module} lists ${modId} as merely suggested in fabric.mod.json"
                }
                if (expectedType == 'optional' && !fabricSuggested) {
                    violations << "${module} does not suggest ${modId} in fabric.mod.json"
                }
                if (expectedType == 'optional' && fabricRequired) {
                    violations << "${module} requires ${modId} in fabric.mod.json, but that edge is an optional integration"
                }
            }
            // The other direction: a declaration that the matrix does not contain. Left unchecked, a stale
            // dependency outlives the relationship it was written for and keeps telling loaders about it.
            (text =~ /(api|implementation|compileOnly)\s+project\(':tianshu-([a-z]+)'\)/).each { match ->
                def dependency = match[2]
                if (dependency in shortNames && dependency != owner && !(dependency in allowed)) {
                    violations << "${module} declares a Gradle dependency on tianshu-${dependency}, which is not an edge in the matrix"
                }
            }
            (tomlText =~ /modId\s*=\s*"tianshu_([a-z]+)"/).each { match ->
                def dependency = match[1]
                if (dependency in shortNames && dependency != owner && !(dependency in allowed)) {
                    violations << "${module} declares tianshu_${dependency} in neoforge.mods.toml, which is not an edge in the matrix"
                }
            }
            ((fabricJson.depends ?: [:]).keySet() + (fabricJson.suggests ?: [:]).keySet()).each { key ->
                def dependency = key.toString() - 'tianshu_'
                if (dependency in shortNames && dependency != owner && !(dependency in allowed)) {
                    violations << "${module} declares ${key} in fabric.mod.json, which is not an edge in the matrix"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Feature dependency declarations are wrong:\n" + violations.join('\n'))
        }
    }
}

// Snapshot of the real project graph, taken after every subproject has been evaluated. It is captured here,
// not read inside the task, because a task action may not reach into other projects under the configuration
// cache — and the project graph is exactly what this gate is about.
def adapterProjects = project(':tianshu-adapter').subprojects as List
// The shared adapter layer is not a Gradle project: one source tree is compiled into every loader adapter,
// so it is scanned by path wherever a rule says "kernel code".
// Version dimension: one shared tree per Minecraft target, named `common-<target>`, and each adapter names the
// tree it compiles in its adapter.properties. The glob picks up a new tree; nothing here is edited per version.
def commonAdapterSources = fileTree('tianshu-adapter') {
    include '*-common/src/main/java/**/*.java'
}
def hostProjectDependencyViolations = []
gradle.projectsEvaluated {
    def kernelProjects = hostModules.findAll { it != 'tianshu-adapter' }.collect { project(":${it}") } + adapterProjects
    kernelProjects.each { hostProject ->
        ['api', 'implementation', 'compileOnly', 'runtimeOnly'].each { configurationName ->
            def configuration = hostProject.configurations.findByName(configurationName)
            if (configuration == null) return
            configuration.dependencies.withType(org.gradle.api.artifacts.ProjectDependency).each { dependency ->
                if (dependency.path in featureModules.collect { ":${it}" }) {
                    hostProjectDependencyViolations << "${hostProject.path} declares a project dependency on ${dependency.path}; the kernel must not depend on a feature module"
                }
            }
        }
    }
}

tasks.register('verifyHostHasNoFeatureDependency') {
    group = 'verification'
    description = 'The kernel modules must never reference or depend on a feature module.'
    def plainHostModules = hostModules.findAll { it != 'tianshu-adapter' }
    def adapterProjectDirs = adapterProjects.collect { it.projectDir }
    def hostBuildFiles = plainHostModules.collect { file("${it}/build.gradle") } +
            adapterProjectDirs.collect { new File(it, 'build.gradle') }
    inputs.files(files(plainHostModules.collect { "${it}/src/main/java" }))
    inputs.files(commonAdapterSources)
    adapterProjectDirs.each { dir -> inputs.dir(new File(dir, 'src/main/java')) }
    inputs.files(hostBuildFiles)
    doLast { task ->
        // A source-free build dependency is the same coupling in a different place: it is what makes the
        // kernel fail to build when a feature jar is removed, even though no import says so.
        hostBuildFiles.each { buildFile ->
            if (!buildFile.exists()) return
            (buildFile.text =~ /(api|implementation|compileOnly) project\(':tianshu-(intake|echo|weaving|auxilium|presence)'\)/).each { match ->
                throw new GradleException("${buildFile} declares a dependency on tianshu-${match[2]}; the kernel must not depend on a feature module")
            }
        }
        def violations = new ArrayList<String>(hostProjectDependencyViolations)
        task.inputs.files.files.each { source ->
            if (!source.path.endsWith('.java')) return
            source.eachLine('UTF-8') { line ->
                if (line.trim() =~ /^import com\.rheinmetal\.tianshu\.function\.(intake|echo|weaving|auxilium|presence)\./) {
                    violations << "${source.name}: ${line.trim()}"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Kernel modules reference feature modules:\n" + violations.join('\n'))
        }
    }
}

tasks.register('verifyCommonAdapterNeutral') {
    group = 'verification'
    description = 'The shared adapter layer must talk to Minecraft without knowing which loader it runs on.'
    // A loader import here would compile in one adapter and fail in the other, so the layer is compiled into
    // both from one tree and the tree is kept loader-free. Comments are allowed to name a loader; code is not.
    inputs.files(commonAdapterSources)
    doLast { task ->
        def forbidden = ['net.neoforged', 'net.fabricmc', 'net.minecraftforge', 'cpw.mods']
        def violations = []
        if (task.inputs.files.files.findAll { it.path.endsWith('.java') }.isEmpty()) {
            throw new GradleException("No shared-layer sources matched common-*/src/main/java; this gate would pass vacuously")
        }        task.inputs.files.files.each { source ->
            if (!source.path.endsWith('.java')) return
            int lineNumber = 0
            source.eachLine('UTF-8') { line ->
                lineNumber++
                def trimmed = line.trim()
                if (trimmed.startsWith('*') || trimmed.startsWith('//') || trimmed.startsWith('/*')) return
                forbidden.each { prefix ->
                    if (trimmed.contains(prefix)) {
                        violations << "${source.name}:${lineNumber} references a loader: ${trimmed}"
                    }
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Shared adapter layer references a loader:\n" + violations.join('\n'))
        }
    }
}

tasks.register('verifyNoPlatformImport') {
    group = 'verification'
    description = 'Rejects Minecraft/NeoForge references in the compiled classes outside the platform adapter.'
    // Reading source lines missed fully-qualified usage and could be defeated by comments; the constant pool
    // of every compiled class is what the JVM actually links against, so the check runs on bytecode.
    def neutralProjects = neutralModules.collect { project(":${it}") }
    inputs.files(files(neutralProjects.collect { it.sourceSets.main.output.classesDirs }))
    dependsOn neutralProjects.collect { it.tasks.named('classes') }
    doLast { task ->
        def forbidden = ['net/minecraft/', 'net/neoforged/', 'org/lwjgl/', 'com/mojang/blaze3d/']
        def violations = []
        task.inputs.files.files.each { root ->
            if (root.isDirectory()) {
                root.eachFileRecurse(groovy.io.FileType.FILES) { entry ->
                    if (!entry.name.endsWith('.class')) return
                    def constantPool = new String(entry.bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                    forbidden.each { prefix ->
                        if (constantPool.contains(prefix)) {
                            violations << "${entry}: references a forbidden platform package: ${prefix}"
                        }
                    }
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Neutral modules reference the platform:\n" + violations.join('\n'))
        }
    }
}

// ---------------------------------------------------------------- universal artifacts
// The feature jars are universal: one file is discovered by both loaders. That only holds if the jar
// actually carries both shells and both manifests. Losing one of them still compiles and still passes every
// source-level gate above, and the symptom is a mod that loads and does nothing on one of the two loaders.
tasks.register('verifyUniversalModuleJars') {
    group = 'verification'
    description = 'Each feature jar must carry both loader shells and both loader manifests.'
    def jarsByModule = featureModules.collectEntries { module ->
        def jarTask = project(":${module}").tasks.named('jar')
        [(module): jarTask.flatMap { it.archiveFile }]
    }
    inputs.files(jarsByModule.values())

    doLast {
        def violations = []
        jarsByModule.each { module, archive ->
            def jarFile = archive.get().asFile
            // Walked explicitly rather than collected: ZipFile.entries() is an Enumeration, and relying on
            // an implicit conversion here is how a check starts silently seeing fewer entries than exist.
            def entries = new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                def names = new HashSet<String>()
                for (def e = zip.entries(); e.hasMoreElements();) {
                    names.add(e.nextElement().name)
                }
                names
            }
            def feature = module - 'tianshu-'
            def shell = feature.capitalize()
            def packagePath = "com/rheinmetal/tianshu/function/${feature}"
            // Normalised to String: interpolated Groovy strings are GStrings, and a GString's hashCode is not
            // a String's, so Set.contains would report every interpolated entry as missing.
            def expected = [
                    'META-INF/neoforge.mods.toml',
                    'fabric.mod.json',
                    "${packagePath}/${shell}NeoForgeMod.class",
                    "${packagePath}/${shell}FabricMod.class",
                    "${packagePath}/${shell}ModuleRegistration.class",
            ].collect { it.toString() }
            expected.each { entry ->
                if (!entries.contains(entry)) {
                    violations << "${jarFile.name} is missing ${entry}"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Feature jars are not universal:\n" + violations.join('\n'))
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyFeatureIsolation')
    dependsOn tasks.named('verifyFeatureOptionalDependencies')
    dependsOn tasks.named('verifyHostHasNoFeatureDependency')
    dependsOn tasks.named('verifyCommonAdapterNeutral')
    dependsOn tasks.named('verifyNoPlatformImport')
    dependsOn tasks.named('verifyUniversalModuleJars')
}

// ---------------------------------------------------------------- test concurrency
// Compiles stay parallel; test tasks run one at a time. Several suites drive real threads and
// wall-clock attention windows (protocol flows, audio device stubs), so letting six module test JVMs
// compete for the CPU turns them into flakes: they pass alone and time out in a full `check`. One
// shared service with a single usage slot serialises them; the configuration has to reach the
// subprojects, because the root project has no Test task of its own.
def testSerialService = gradle.sharedServices.registerIfAbsent('tianshuTestSerial', org.gradle.api.services.BuildService) {
    maxParallelUsages = 1
}

allprojects {
    tasks.withType(Test).configureEach {
        usesService(testSerialService)
        maxParallelForks = 1
        // The suites drive threads and audio stubs, not large heaps. The JVM default (a quarter of physical
        // RAM) reserves far more than they use and can fail to start on a machine with little free commit.
        maxHeapSize = '1g'
    }
}

// ---------------------------------------------------------------- development runs
// "Where the run is started from" is the whole answer to "which modules are installed":
//   repository root   -> every feature (the full assembly)
//   a feature module  -> that feature plus the modules it requires, never its optional partners
//   the adapter       -> the kernel alone, which is what a third-party integration sees
// The launch itself stays in the adapter; these tasks only delegate to it, and the adapter works out the
// module set from where the invocation came from.
tasks.register('runClient') {
    group = 'tianshu'
    description = 'Runs the development client with every feature module installed.'
    dependsOn ':tianshu-adapter:1.21-1.21.1-neoforge:runClient'
}

subprojects {
    plugins.withType(JavaPlugin).configureEach {
        if (name in featureModules) {
            tasks.register('runClient') {
                group = 'tianshu'
                description = "Runs the development client with ${name} and the modules it requires."
                dependsOn ':tianshu-adapter:1.21-1.21.1-neoforge:runClient'
            }
        }
    }
}
