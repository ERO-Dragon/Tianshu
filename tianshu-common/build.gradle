plugins {
    id 'java-library'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

java.toolchain.languageVersion = JavaLanguageVersion.of((findProperty('java_version') ?: '21') as int)

repositories {
    mavenCentral()
}

def extractTianshuLibsJarJar = tasks.register('extractTianshuLibsJarJar', Copy) {
    def libsJars = fileTree('../libs') { include 'tianshu_libs-*.jar' }
    from(libsJars.collect { zipTree(it) }) {
        include 'META-INF/jarjar/*.jar'
        eachFile { details ->
            details.path = details.name
        }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir('extracted/tianshu-libs-jarjar')
}

dependencies {
    compileOnly fileTree('../libs') { include 'tianshu_libs-*.jar' }
    testImplementation fileTree('../libs') { include 'tianshu_libs-*.jar' }
    compileOnly 'com.google.code.gson:gson:2.10.1'
    compileOnly 'org.apache.commons:commons-compress:1.26.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.apache.commons:commons-compress:1.26.0'
    testRuntimeOnly 'it.unimi.dsi:fastutil:8.5.15'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.9'
    testRuntimeOnly files({
        fileTree(layout.buildDirectory.dir('extracted/tianshu-libs-jarjar').get().asFile) {
            include '*.jar'
        }.files
    })
}

test {
    useJUnitPlatform()
    dependsOn extractTianshuLibsJarJar
    def mossOrtJarPath = System.getProperty('tianshu.moss.ort.jar', System.getenv('TIANSHU_MOSS_ORT_JAR') ?: '')
    if (mossOrtJarPath != null && !mossOrtJarPath.isBlank()) {
        classpath = files(mossOrtJarPath) + classpath
    }
    systemProperty 'tianshu.llm.smoke', System.getProperty('tianshu.llm.smoke', System.getenv('TIANSHU_LLM_SMOKE') ?: 'false')
    systemProperty 'tianshu.llm.smoke.model', System.getProperty('tianshu.llm.smoke.model', System.getenv('TIANSHU_LLM_SMOKE_MODEL') ?: '')
    systemProperty 'tianshu.llm.smoke.embeddingModel', System.getProperty('tianshu.llm.smoke.embeddingModel', System.getenv('TIANSHU_LLM_SMOKE_EMBEDDING_MODEL') ?: '')
    systemProperty 'tianshu.ax.longrun.smoke', System.getProperty('tianshu.ax.longrun.smoke', System.getenv('TIANSHU_AX_LONGRUN_SMOKE') ?: 'false')
    systemProperty 'tianshu.ax.longrun.rounds', System.getProperty('tianshu.ax.longrun.rounds', System.getenv('TIANSHU_AX_LONGRUN_ROUNDS') ?: '10')
    systemProperty 'tianshu.ax.longrun.context', System.getProperty('tianshu.ax.longrun.context', System.getenv('TIANSHU_AX_LONGRUN_CONTEXT') ?: '4096')
    systemProperty 'tianshu.ax.longrun.timeoutSeconds', System.getProperty('tianshu.ax.longrun.timeoutSeconds', System.getenv('TIANSHU_AX_LONGRUN_TIMEOUT_SECONDS') ?: '180')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    archiveBaseName = 'tianshu-common'
}
