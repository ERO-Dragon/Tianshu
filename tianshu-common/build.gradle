plugins {
    id 'java-library'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

java.toolchain.languageVersion = JavaLanguageVersion.of((findProperty('java_version') ?: '21') as int)

repositories {
    mavenCentral()
}

def extractTianshuLibsJarJar = tasks.register('extractTianshuLibsJarJar', Sync) {
    def libsJars = fileTree('../libs') { include 'tianshu_libs-*.jar' }
    from(libsJars.collect { zipTree(it) }) {
        include 'META-INF/jarjar/*.jar'
        eachFile { details ->
            details.path = details.name
        }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir('extracted/tianshu-libs-jarjar')
}

def tianshuLibsJarJar = fileTree(layout.buildDirectory.dir('extracted/tianshu-libs-jarjar')) {
    include '*.jar'
}

dependencies {
    compileOnly fileTree('../libs') { include 'tianshu_libs-*.jar' }
    testImplementation fileTree('../libs') { include 'tianshu_libs-*.jar' }
    compileOnly 'com.google.code.gson:gson:2.10.1'
    compileOnly 'org.apache.commons:commons-compress:1.26.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.apache.commons:commons-compress:1.26.0'
    testRuntimeOnly 'it.unimi.dsi:fastutil:8.5.15'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.9'
    testRuntimeOnly tianshuLibsJarJar
}

test {
    useJUnitPlatform()
    dependsOn extractTianshuLibsJarJar
    def mossOrtJarPath = System.getProperty('tianshu.moss.ort.jar', System.getenv('TIANSHU_MOSS_ORT_JAR') ?: '')
    if (mossOrtJarPath != null && !mossOrtJarPath.isBlank()) {
        classpath = files(mossOrtJarPath) + classpath
    }
    systemProperty 'tianshu.llm.smoke', System.getProperty('tianshu.llm.smoke', System.getenv('TIANSHU_LLM_SMOKE') ?: 'false')
    systemProperty 'tianshu.llm.smoke.model', System.getProperty('tianshu.llm.smoke.model', System.getenv('TIANSHU_LLM_SMOKE_MODEL') ?: '')
    systemProperty 'tianshu.llm.smoke.embeddingModel', System.getProperty('tianshu.llm.smoke.embeddingModel', System.getenv('TIANSHU_LLM_SMOKE_EMBEDDING_MODEL') ?: '')
    systemProperty 'tianshu.ax.longrun.smoke', System.getProperty('tianshu.ax.longrun.smoke', System.getenv('TIANSHU_AX_LONGRUN_SMOKE') ?: 'false')
    systemProperty 'tianshu.ax.longrun.rounds', System.getProperty('tianshu.ax.longrun.rounds', System.getenv('TIANSHU_AX_LONGRUN_ROUNDS') ?: '10')
    systemProperty 'tianshu.ax.longrun.context', System.getProperty('tianshu.ax.longrun.context', System.getenv('TIANSHU_AX_LONGRUN_CONTEXT') ?: '4096')
    systemProperty 'tianshu.ax.longrun.timeoutSeconds', System.getProperty('tianshu.ax.longrun.timeoutSeconds', System.getenv('TIANSHU_AX_LONGRUN_TIMEOUT_SECONDS') ?: '180')
    // MOSS-TTS benchmark harness. It runs against a real installed model, so it stays opt-in and
    // takes its paths and cadence from the caller instead of hardcoding a model location.
    systemProperty 'tianshu.moss.smoke', System.getProperty('tianshu.moss.smoke', System.getenv('TIANSHU_MOSS_SMOKE') ?: 'false')
    systemProperty 'tianshu.moss.modelDir', System.getProperty('tianshu.moss.modelDir', System.getenv('TIANSHU_MOSS_MODEL_DIR') ?: '')
    systemProperty 'tianshu.moss.voiceWav', System.getProperty('tianshu.moss.voiceWav', System.getenv('TIANSHU_MOSS_VOICE_WAV') ?: '')
    systemProperty 'tianshu.moss.outputDir', System.getProperty('tianshu.moss.outputDir', System.getenv('TIANSHU_MOSS_OUTPUT_DIR') ?: '')
    systemProperty 'tianshu.moss.cadence', System.getProperty('tianshu.moss.cadence', System.getenv('TIANSHU_MOSS_CADENCE') ?: '')
    systemProperty 'tianshu.moss.streaming', System.getProperty('tianshu.moss.streaming', System.getenv('TIANSHU_MOSS_STREAMING') ?: 'false')
    systemProperty 'tianshu.moss.processorSet', System.getProperty('tianshu.moss.processorSet', System.getenv('TIANSHU_MOSS_PROCESSOR_SET') ?: '')
    systemProperty 'tianshu.moss.promptSource', System.getProperty('tianshu.moss.promptSource', System.getenv('TIANSHU_MOSS_PROMPT_SOURCE') ?: '')
    systemProperty 'tianshu.moss.maxRtf', System.getProperty('tianshu.moss.maxRtf', System.getenv('TIANSHU_MOSS_MAX_RTF') ?: '')
    systemProperty 'tianshu.moss.texts', System.getProperty('tianshu.moss.texts', System.getenv('TIANSHU_MOSS_TEXTS') ?: '')
    systemProperty 'tianshu.moss.repeat', System.getProperty('tianshu.moss.repeat', System.getenv('TIANSHU_MOSS_REPEAT') ?: '')
    systemProperty 'tianshu.moss.profileDir', System.getProperty('tianshu.moss.profileDir', System.getenv('TIANSHU_MOSS_PROFILE_DIR') ?: '')
    systemProperty 'tianshu.moss.seed', System.getProperty('tianshu.moss.seed', System.getenv('TIANSHU_MOSS_SEED') ?: '')
    systemProperty 'tianshu.moss.ortConfig', System.getProperty('tianshu.moss.ortConfig', System.getenv('TIANSHU_MOSS_ORT_CONFIG') ?: '')
    systemProperty 'tianshu.moss.threads', System.getProperty('tianshu.moss.threads', System.getenv('TIANSHU_MOSS_THREADS') ?: '')
    systemProperty 'tianshu.moss.pinDims', System.getProperty('tianshu.moss.pinDims', System.getenv('TIANSHU_MOSS_PIN_DIMS') ?: '')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    archiveBaseName = 'tianshu-common'
}
