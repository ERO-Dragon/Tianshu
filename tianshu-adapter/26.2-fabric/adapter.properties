# Everything that pins this adapter to one Minecraft line lives here.
# 26.x is unobfuscated: there are no mappings, the plain loom plugin is used, and Fabric dependencies are plain
# `implementation` rather than `modImplementation`.
minecraft_version=26.2
fabric_loader_version=0.19.5
fabric_api_version=0.161.0+26.2
java_version=25
# 26.2 reworked the GUI/render entry points again (Gui owns the screen stack, StagedVertexBuffer replaced the
# immediate upload helpers), so it gets its own tree; 26.1 keeps 26.1-common.
shared_layer=26.2-common