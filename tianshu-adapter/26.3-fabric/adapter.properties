# Everything that pins this adapter to one Minecraft line lives here.
# 26.x is unobfuscated: there are no mappings, the plain loom plugin is used, and Fabric dependencies are plain
# `implementation` rather than `modImplementation`.
minecraft_version=26.3
fabric_loader_version=0.19.5
fabric_api_version=0.165.0+26.3
java_version=25
# 26.3 moved the render engine into com.mojang.renderpearl and turned DisplayInfo into a record, so it gets its
# own tree; 26.1 keeps 26.1-common and 26.2 keeps 26.2-common.
shared_layer=26.3-common