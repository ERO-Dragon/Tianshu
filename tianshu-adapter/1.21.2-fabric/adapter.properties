# Everything that pins this adapter to one Minecraft line lives here.
# Adding a platform or a version means adding a sibling directory, not editing the core build.
minecraft_version=1.21.2
loom_version=1.15.5
fabric_loader_version=0.16.14
fabric_api_version=0.106.1+1.21.2
# Which shared (loader-neutral) source tree this adapter compiles. A new adapter for a Minecraft
# patch that keeps this tree compiling just points here; a version that breaks it gets its own tree.
shared_layer=1.21.2-1.21.4-common
