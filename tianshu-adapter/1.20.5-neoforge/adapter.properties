# Everything that pins this adapter to one Minecraft line lives here.
# 1.20.5 starts the DataComponents generation and runs on Java 21. NeoForge 20.5 publishes no Gradle Module
# Metadata, so ModDevGradle cannot serve it and the older NeoGradle plugin does.
minecraft_version=1.20.5
neo_version=20.5.21-beta
java_version=21
# Which shared (loader-neutral) source tree this adapter compiles.
shared_layer=1.20.5-1.20.6-common
