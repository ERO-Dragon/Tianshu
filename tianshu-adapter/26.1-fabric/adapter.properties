# Everything that pins this adapter to one Minecraft line lives here.
# 26.x is unobfuscated: there are no mappings, the plain loom plugin is used, and Fabric dependencies are plain
# `implementation` rather than `modImplementation`.
# The compile target is the OLDEST patch of the 26.1 line, which is what makes one jar cover 26.1 / 26.1.1 / 26.1.2:
# any API added later is simply not used. The manifest then declares the whole line (`~26.1` = [26.1, 26.2)) rather
# than the exact version.
minecraft_version=26.1
fabric_loader_version=0.19.5
fabric_api_version=0.145.1+26.1
java_version=25
shared_layer=26.1-common