# Everything that pins this adapter to one Minecraft line lives here.
# 1.20.6 closes the 1.20.5 line and runs on Java 21. NeoForge 20.6 publishes Gradle Module Metadata, so the
# regular ModDevGradle plugin serves it.
minecraft_version=1.20.6
neo_version=20.6.144
java_version=21
# Which shared (loader-neutral) source tree this adapter compiles.
shared_layer=1.20.5-1.20.6-common
