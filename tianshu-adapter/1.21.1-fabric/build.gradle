plugins {
    id 'java-library'
    id 'net.fabricmc.fabric-loom-remap' version '1.15.5'
}

version = mod_version
group = mod_group_id

// Everything that pins this adapter to one Minecraft line lives in adapter.properties, exactly as the
// NeoForge adapter does it: a new platform or a new version is a sibling directory, never an edit here.
def adapterProperties = new Properties()
file('adapter.properties').withInputStream { adapterProperties.load(it) }
def mcVersion = adapterProperties.getProperty('minecraft_version')
def loaderVersion = adapterProperties.getProperty('fabric_loader_version')
def apiVersion = adapterProperties.getProperty('fabric_api_version')
def sharedLayer = adapterProperties.getProperty('shared_layer')
def sharedLayerRoot = "../${sharedLayer}"

// Both adapters ship a jar with the same mod id, so the artifact name says which loader it belongs to.
base {
    archivesName = "${mod_id}-fabric-${mcVersion}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of((findProperty('java_version') ?: '21') as int)

// Lab's platform entry is compiled for its own mod; Ferry's jar contains only the main source set.
def labProject = evaluationDependsOn(':tianshu-lab')
sourceSets {
    labEntry {
        java.setSrcDirs([labProject.file('src/fabricEntry/java')])
        compileClasspath += sourceSets.main.compileClasspath + labProject.sourceSets.main.output
    }
}

// ---------------------------------------------------------------- shared Minecraft layer
// The same tree the NeoForge adapter compiles, from source: a Gradle project cannot be compiled once against
// two loaders' Minecraft artifacts, so the tree is shared and each adapter supplies the classpath.
// `verifyCommonAdapterNeutral` keeps loader imports out of it.
sourceSets {
    main {
        java.srcDir "${sharedLayerRoot}/src/main/java"
        resources.srcDir "${sharedLayerRoot}/src/main/resources"
    }
    test {
        java.srcDir "${sharedLayerRoot}/src/test/java"
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${apiVersion}"

    implementation project(':tianshu-client')
    compileOnly fileTree('../../libs') { include 'tianshu_foundry-*.jar' }
    runtimeOnly fileTree('../../libs') { include 'tianshu_foundry-*.jar' }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// ---------------------------------------------------------------- build profile
// The same numbers the NeoForge adapter writes: a release carries its own version and api epoch, and the
// runtime probe reports facts instead of literals. Development runs default to the Debug channel.
def devRunRequested = gradle.startParameter.taskNames.any { taskName ->
    def name = taskName.tokenize(':').last()
    name == 'runClient' || name == 'runServer'
}
def tianshuDebugBuild = providers.gradleProperty('tianshuDebugBuild')
        .map { it.toBoolean() }
        .orElse(devRunRequested)
def tianshuBuildProfile = layout.buildDirectory.file('generated/resources/tianshu-build.properties')
tasks.register('generateTianshuBuildProfile') {
    def tianshuVersion = providers.gradleProperty('mod_version').orElse('0.0')
    def tianshuApiVersion = tianshuVersion.map { value -> value.split('\\.')[0] }
    inputs.property('debugBuild', tianshuDebugBuild)
    inputs.property('version', tianshuVersion)
    inputs.property('apiVersion', tianshuApiVersion)
    outputs.file(tianshuBuildProfile)
    doLast {
        def output = tianshuBuildProfile.get().asFile
        output.parentFile.mkdirs()
        output.text = "debugBuild=${tianshuDebugBuild.get()}\n" +
                "version=${tianshuVersion.get()}\n" +
                "apiVersion=${tianshuApiVersion.get()}\n"
    }
}

// ---------------------------------------------------------------- kernel assets
// The kernel's translations are merged by tianshu-client (language files from every module land in one file),
// and this jar ships them. A Fabric *development* run is the reason for the explicit wiring: there the kernel
// arrives as a plain project dependency, which is not a mod resource pack, so nothing would read its `assets/`
// tree — and every string in the product would render as a raw key.
sourceSets.main.resources.srcDir(project(':tianshu-client').layout.buildDirectory.dir('generated/lang'))
tasks.named('processResources') {
    dependsOn project(':tianshu-client').tasks.named('mergeLang')
}

// ---------------------------------------------------------------- manifest expansion
def manifestProperties = [
        mod_id             : mod_id,
        mod_name           : mod_name,
        mod_version        : mod_version,
        mod_license        : mod_license,
        minecraft_version_predicate : adapterProperties.getProperty('fabric_minecraft_version_range') ?: mcVersion,
        loader_version     : loaderVersion,
]
processResources {
    inputs.properties manifestProperties
    filesMatching('fabric.mod.json') {
        expand manifestProperties
    }
    from(tianshuBuildProfile.map { it.asFile.parentFile })
}
tasks.named('processResources') {
    dependsOn tasks.named('generateTianshuBuildProfile')
}

// The kernel is one mod: the adapter plus every platform-neutral module that has no manifest of its own.
jar {
    // The kernel's translations are already this mod's own resources (see "kernel assets" above), so they are
    // not copied a second time from the client module's output.
    from(project(':tianshu-client').sourceSets.main.output) {
        exclude 'assets/tianshu/lang/**'
    }
    from project(':tianshu-core').sourceSets.main.output
    from project(':tianshu-api').sourceSets.main.output
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// A development run installs this adapter plus the feature modules it names: a module is discovered by its own
// manifest, so on Fabric a feature reaches the run as its jar in `run/mods`, not as a classpath entry.
//
// One composition rule, the same property the NeoForge adapter reads: `-PfeatureMods=intake,echo,...,lab` states
// exactly what the run installs, and absent means the kernel alone. It used to be implicit — "anything a previous
// run left in run/mods" — and the shelf was never actually cleaned (the delete patterns said `tianshu-intake*` while
// the jars are `tianshu_intake-*.jar`), so an "adapter only" run quietly kept every feature and a stale bench from a
// month earlier. The module set is now a stated input, and the bench is a peer of the features rather than a jar
// that happened to be lying around.
// The module set comes from the root build, the same answer the NeoForge adapter reads: an adapter-started run is the
// kernel plus its bench, the repository root brings every module, and `-PfeatureMods=` states the set outright.
// On Fabric a feature reaches the run as its jar in `run/mods`; the lab's jar carries both loader entries, so the
// bench is a peer of the features rather than a jar that happened to be lying on the shelf.
def devFeatureMods = rootProject.devRunModules(project, gradle.startParameter.taskNames,
        gradle.startParameter.currentDir)
devFeatureMods.each { feature -> project.evaluationDependsOn(":tianshu-${feature}") }
def devModuleJars = devFeatureMods.collect { feature ->
    project(":tianshu-${feature}").tasks.named('jar').flatMap { it.archiveFile }
}
tasks.register('prepareDevMods', Copy) {
    from(devModuleJars)
    into layout.projectDirectory.dir('run/mods')
}
// A run has to start from a clean shelf, or a jar copied by an earlier run decides this run's composition. Every jar
// in `run/mods` is placed there by `prepareDevMods`, so the shelf is emptied wholesale: matching names by hand got
// this wrong once already (a module's jar is named after its mod id, not after its project).
tasks.register('clearDevMods', Delete) {
    delete fileTree(layout.projectDirectory.dir('run/mods')) { include '*.jar' }
}
['runClient', 'runServer'].each { name ->
    tasks.named(name) { dependsOn 'clearDevMods', 'prepareDevMods' }
}
tasks.named('prepareDevMods') { mustRunAfter 'clearDevMods' }

// Unattended verification. The dedicated server keeps its own run directory (Fabric's processedMods cache is
// exclusive), and the dev client joins with a fixed name so the server's offline profile matches ops.json.
loom {
    runs {
        server {
            runDir 'run-server'
        }
        client {
            programArgs '--username', 'Dev'
            def quickPlayWorld = providers.gradleProperty('quickPlayWorld').getOrNull()
            if (quickPlayWorld != null && !quickPlayWorld.isBlank()) {
                programArgs '--quickPlaySingleplayer', quickPlayWorld
            }
            def quickPlayServer = providers.gradleProperty('quickPlayServer').getOrNull()
            if (quickPlayServer != null && !quickPlayServer.isBlank()) {
                programArgs '--quickPlayMultiplayer', quickPlayServer
            }
            def labAcceptance = providers.gradleProperty('tianshuLabAcceptance').getOrNull()
            if (labAcceptance != null && !labAcceptance.isBlank()) {
                property 'tianshu.lab.acceptance', labAcceptance
            }
        }
    }
}
// Lab owns its handshake. Remap just its Fabric shell, leaving the NeoForge classes in their native namespace.
def labEntryJar = tasks.register('labEntryJar', Jar) {
    archiveClassifier.set('lab-entry-dev')
    destinationDirectory.set(layout.buildDirectory.dir('lab'))
    from sourceSets.labEntry.output
}
tasks.register('remapLabFabricEntry', net.fabricmc.loom.task.RemapJarTask) {
    inputFile.set(labEntryJar.flatMap { it.archiveFile })
    archiveFileName.set('entry.jar')
    destinationDirectory.set(layout.buildDirectory.dir('lab'))
    addNestedDependencies.set(false)
}
