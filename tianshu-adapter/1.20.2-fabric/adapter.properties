# Everything that pins this adapter to one Minecraft line lives here.
# 1.20.2 introduced CustomPacketPayload — the payload carries its own channel id and writes itself — while the
# codec is still the hand-written buffer one, the game is obfuscated and targets Java 17, so the adapter remaps
# with Mojang's official mappings.
minecraft_version=1.20.2
fabric_loader_version=0.16.14
fabric_api_version=0.91.6+1.20.2
java_version=17
# Which shared (loader-neutral) source tree this adapter compiles.
shared_layer=1.20.2-common
