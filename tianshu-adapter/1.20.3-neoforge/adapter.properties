# Everything that pins this adapter to one Minecraft line lives here.
# 1.20.3 is a real NeoForge line (20.3.x) that publishes no Gradle Module Metadata, so ModDevGradle cannot serve it
# and the older NeoGradle plugin does; the game still runs on Java 17 and shares the 1.20.4 payload records, while
# NeoForge 20.3 itself still speaks the old SimpleChannel networking.
minecraft_version=1.20.3
neo_version=20.3.8-beta
java_version=17
# Which shared (loader-neutral) source tree this adapter compiles.
shared_layer=1.20.4-common
