plugins {
    id 'java-library'
    id 'maven-publish'
    // 1.20.1 is the legacy (Forge 47) generation: ModDevGradle serves it through its legacyforge variant.
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
    id 'idea'
}

// The official NeoForged maven is unreachable from this network at times (the TLS handshake is reset), so two mirrors
// are declared and sorted first: both carry net.neoforged:forge and the MCP data this generation needs, and Gradle
// aborts resolution on a connection error instead of trying the next repository. The primary stays configured by the
// plugin, so a machine that can reach it keeps using it.
repositories {
    maven { url = 'https://bmclapi2.bangbang93.com/maven' }
}
def legacyMirror = repositories.maven { url = 'https://maven.creeperhost.net' }
repositories.remove(legacyMirror)
repositories.add(0, legacyMirror)

// NeoForged publishes this generation's Minecraft library list (net.neoforged:minecraft-dependencies:1.20.1) only on
// its /mojang-meta host, which this network cannot reach, and no mirror carries it. The copy under maven-fallback/ is
// generated from Mojang's official 1.20.1 version manifest — the same input that host's artifact is built from — and
// lists every non-native library the game ships with. It is declared first (and the unreachable host removed below)
// so the build does not depend on a host that cannot be reached; a machine that can reach it gets the same content.
// This generation's build script pulls a few dependencies with dynamic versions (`2.11.+`), which resolve through
// maven-metadata.xml; Maven Central is the only repository here that serves those, so it is declared before the
// unreachable primary instead of last.
def centralRepo = repositories.mavenCentral()
repositories.remove(centralRepo)
repositories.add(1, centralRepo)

def fallbackRepo = repositories.maven {
    url = uri('maven-fallback')
    // Gradle 9's default metadata sources for a maven repository do not include Gradle Module Metadata; this copy is
    // module metadata only (the artifact has no jar), so the source has to be enabled explicitly.
    metadataSources { gradleMetadata(); artifact() }
}
repositories.remove(fallbackRepo)
repositories.add(0, fallbackRepo)
repositories.removeAll { it.name == 'Mojang Meta' }

version = mod_version
group = mod_group_id

// Everything that pins this adapter to one Minecraft line lives in adapter.properties.
// Adding a platform or a version means adding a sibling directory, not editing the core build.
def adapterProperties = new Properties()
file('adapter.properties').withInputStream { adapterProperties.load(it) }
def forgeVersion = adapterProperties.getProperty('forge_version')
// The loader range is derived from the pinned version (47) instead of typed a second time.
def forgeVersionRange = "[" + forgeVersion.split('-')[1].split('\\.')[0] + ",)"
def mcVersion = adapterProperties.getProperty('minecraft_version')
def parchmentMappingsVersion = adapterProperties.getProperty('parchment_mappings_version')
def parchmentMinecraftVersion = adapterProperties.getProperty('parchment_minecraft_version')
def sharedLayer = adapterProperties.getProperty('shared_layer')
def sharedLayerRoot = "../${sharedLayer}"

// A normal game installation extracts the LWJGL native libraries next to the jars and points the JVM at them.
// A development run has the jars but nobody extracts the natives, so the client dies before the main menu with
// "Failed to locate library: lwjgl.dll". They are taken from the same LWJGL version the line ships, unpacked
// under build/, and handed to the client run through java.library.path.
def lwjglVersion = adapterProperties.getProperty('lwjgl_version')
configurations {
    lwjglNatives
}
dependencies {
    ['lwjgl', 'lwjgl-glfw', 'lwjgl-jemalloc', 'lwjgl-openal', 'lwjgl-opengl', 'lwjgl-stb', 'lwjgl-tinyfd'].each { module ->
        lwjglNatives "org.lwjgl:${module}:${lwjglVersion}:natives-windows"
    }
}
def lwjglNativesDir = layout.buildDirectory.dir('natives/lwjgl')
def extractLwjglNatives = tasks.register('extractLwjglNatives', Sync) {
    group = 'build'
    description = 'Extracts the LWJGL native libraries the development client loads.'
    // Every natives jar carries the same META-INF bookkeeping and keeps its DLLs under windows/x64/org/lwjgl;
    // the run needs them in one flat directory, which is what java.library.path points at.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ configurations.lwjglNatives.collect { zipTree(it) } }) {
        include 'windows/x64/org/lwjgl/**/*.dll'
        eachFile { it.path = it.name }
    }
    into lwjglNativesDir
}
tasks.matching { it.name == 'runClient' }.configureEach {
    dependsOn extractLwjglNatives
}

// Running the NeoForge client from the Gradle panel is the development path,
// so it defaults to the Debug channel. Artifact builds remain Release by
// default. An explicit property always wins over the task-based default.
// A server run is a development path too: it is how the optional server
// component is exercised in the same debug channel.
def devRunRequested = gradle.startParameter.taskNames.any { taskName ->
    def name = taskName.tokenize(':').last()
    name == 'runClient' || name == 'runServer'
}
def tianshuDebugBuild = providers.gradleProperty('tianshuDebugBuild')
        .map { it.toBoolean() }
        .orElse(devRunRequested)
def tianshuBuildProfile = layout.buildDirectory.file('generated/resources/tianshu-build.properties')
tasks.register('generateTianshuBuildProfile') {
    // The build owns the numbers: a release carries its own mod version and the api epoch it was built against,
    // so the runtime probe reports facts instead of literals. The epoch is the mod version's MAJOR, derived here
    // rather than typed into a second property that could drift.
    def tianshuVersion = providers.gradleProperty('mod_version').orElse('0.0')
    def tianshuApiVersion = tianshuVersion.map { value -> value.split('\\.')[0] }
    inputs.property('debugBuild', tianshuDebugBuild)
    inputs.property('version', tianshuVersion)
    inputs.property('apiVersion', tianshuApiVersion)
    outputs.file(tianshuBuildProfile)
    doLast {
        def output = tianshuBuildProfile.get().asFile
        output.parentFile.mkdirs()
        output.text = "debugBuild=${tianshuDebugBuild.get()}\n" +
                "version=${tianshuVersion.get()}\n" +
                "apiVersion=${tianshuApiVersion.get()}\n"
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of((adapterProperties.getProperty('java_version') ?: '21') as int)

// ---------------------------------------------------------------- shared Minecraft layer
// Everything that talks to Minecraft but not to a loader lives in tianshu-adapter/common and is compiled here
// from source. A Gradle project cannot be compiled once against two loaders' Minecraft artifacts, so the tree
// is shared and each adapter supplies its own classpath; `verifyCommonAdapterNeutral` keeps loader imports out
// of it, which is the whole contract. A sibling adapter (1.21.1-fabric) includes the same directory.
sourceSets {
    main {
        java.srcDir "${sharedLayerRoot}/src/main/java"
        resources.srcDir "${sharedLayerRoot}/src/main/resources"
    }
    test {
        java.srcDir "${sharedLayerRoot}/src/test/java"
    }
}

repositories {
}

legacyForge {
    version = forgeVersion

    parchment {
        mappingsVersion = parchmentMappingsVersion
        minecraftVersion = parchmentMinecraftVersion
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // The extracted natives from extractLwjglNatives; the early window loads GLFW before the game
            // would set up its own library path.
            systemProperty 'java.library.path', lwjglNativesDir.get().asFile.absolutePath
            systemProperty 'org.lwjgl.librarypath', lwjglNativesDir.get().asFile.absolutePath
            // Optional headless verification: jump straight into a world so the module lifecycle
            // actually runs. Pass -PquickPlayWorld=<save name>; absent by default.
            def quickPlayWorld = providers.gradleProperty('quickPlayWorld').getOrNull()
            if (quickPlayWorld != null && !quickPlayWorld.isBlank()) {
                programArguments.addAll '--quickPlaySingleplayer', quickPlayWorld
            }
        }

        server {
            server()
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    // Which mods a development run installs is decided by where the run is started from:
    //   repository root  -> every feature (the full assembly)
    //   this adapter     -> the kernel alone, which is what a third-party integration sees
    //   a feature module -> that feature plus the modules it requires, never its optional partners
    // so launching `runClient` from echo installs kernel+echo, and launching it from auxilium installs
    // kernel+auxilium+intake+weaving (its hard dependencies) but not echo (an optional integration).
    // `-PfeatureMods=` overrides the whole thing: `-PfeatureMods=` is the kernel alone.
    def runFeatureNames = ['intake', 'echo', 'weaving', 'auxilium', 'presence']
    def startedFrom = {
        def startParameter = gradle.startParameter
        def explicitFeature = startParameter.taskNames.findResult { name ->
            def match = name =~ /^:?(tianshu-(intake|echo|weaving|auxilium|presence)):run(Client|Server)$/
            match.find() ? match.group(2) : null
        }
        if (explicitFeature != null) {
            return explicitFeature
        }
        if (startParameter.taskNames.any { name ->
                    (name.endsWith('runClient') || name.endsWith('runServer')) && name.contains('tianshu-adapter')
                }) {
            return 'adapter'
        }
        // A bare `runClient` carries no path: the directory it was typed in decides.
        def currentDir = startParameter.currentDir
        def owner = ([project] + runFeatureNames.collect { rootProject.project(":tianshu-${it}") })
                .find { it.projectDir == currentDir }
        if (owner == null) {
            return 'root'
        }
        return owner == project ? 'adapter' : (owner.name - 'tianshu-')
    }()
    def devFeatureMods = {
        def explicit = findProperty('featureMods')
        if (explicit != null) {
            return explicit.toString().split(',').collect { it.trim() }.findAll { !it.isEmpty() }
        }
        if (startedFrom == 'adapter') {
            return []
        }
        if (startedFrom == 'root') {
            return runFeatureNames
        }
        // A feature run boots its required partners too: without them it cannot assemble at all.
        return ([startedFrom] + (rootProject.requiredFeatureEdges[startedFrom] ?: [])).unique()
    }()
    if (gradle.startParameter.taskNames.any { name ->
                name.endsWith('runClient') || name.endsWith('runServer')
            }) {
        logger.lifecycle("tianshu dev run: started from '${startedFrom}', installing " +
                (devFeatureMods.isEmpty() ? 'the kernel alone' : devFeatureMods.join(', ')))
    }

    mods {
        // One entry per mod id. The kernel mod owns the adapter plus every platform-neutral module
        // that carries no metadata of its own; each feature is a separate mod with its own manifest.
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(project(':tianshu-client').sourceSets.main)
            sourceSet(project(':tianshu-core').sourceSets.main)
            sourceSet(project(':tianshu-api').sourceSets.main)
        }
        // A feature's entry source set is what makes it a mod at all. The @Mod class lives there, so a
        // mod declared with only `main` is listed in game (its manifest is on the classpath) while no
        // constructor ever runs — nothing registers, and its settings page never appears. Production jars
        // carry the entry classes; the development run has to include that output explicitly.
        // This line is the Forge 47 (net.minecraftforge) generation, so the entry is the feature's
        // `legacyEntry` shell; `neoforgeEntry` belongs to the net.neoforged lines and would leave the
        // manifest without a matching @Mod class ("has mods that were not found").
        if ('intake' in devFeatureMods) {
            tianshu_intake {
                sourceSet(project(':tianshu-intake').sourceSets.main)
                sourceSet(project(':tianshu-intake').sourceSets.legacyEntry)
            }
        }
        if ('echo' in devFeatureMods) {
            tianshu_echo {
                sourceSet(project(':tianshu-echo').sourceSets.main)
                sourceSet(project(':tianshu-echo').sourceSets.legacyEntry)
            }
        }
        if ('weaving' in devFeatureMods) {
            tianshu_weaving {
                sourceSet(project(':tianshu-weaving').sourceSets.main)
                sourceSet(project(':tianshu-weaving').sourceSets.legacyEntry)
            }
        }
        if ('auxilium' in devFeatureMods) {
            tianshu_auxilium {
                sourceSet(project(':tianshu-auxilium').sourceSets.main)
                sourceSet(project(':tianshu-auxilium').sourceSets.legacyEntry)
            }
        }
        if ('presence' in devFeatureMods) {
            tianshu_presence {
                sourceSet(project(':tianshu-presence').sourceSets.main)
                sourceSet(project(':tianshu-presence').sourceSets.legacyEntry)
            }
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation project(':tianshu-client')
    compileOnly fileTree('../../libs') { include 'tianshu_libs-*.jar' }
    localRuntime fileTree('../../libs') { include 'tianshu_libs-*.jar' }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    srcDir(tianshuBuildProfile.map { it.asFile.parentFile })
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}
jar {
    from project(':tianshu-client').sourceSets.main.output
    from project(':tianshu-core').sourceSets.main.output
    from project(':tianshu-api').sourceSets.main.output
    // Avoid signature metadata conflicts when aggregating module output.
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: "[${mcVersion}]",
            forge_version          : forgeVersion,
            forge_version_range    : forgeVersionRange,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            tianshu_libs_version_range: tianshu_libs_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
// tasks.named('jarJar') {
//     exclude 'ai/onnxruntime/native/win-x64/onnxruntime.dll'
// }
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
tasks.named('processResources') {
    dependsOn tasks.named('generateTianshuBuildProfile')
}
