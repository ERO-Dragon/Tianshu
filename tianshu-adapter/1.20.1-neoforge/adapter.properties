# Everything that pins this adapter to one Minecraft line lives here.
# 1.20.1 is the Forge-era NeoForge line: the published artifact is net.neoforged:forge (47.x), served through
# ModDevGradle's legacyforge variant, and the game runs on Java 17.
minecraft_version=1.20.1
forge_version=1.20.1-47.4.28
java_version=17
# The LWJGL version Forge 47 ships. Its native libraries are not on the development run classpath, so the
# build extracts them from this version's `natives-windows` artifacts (see build.gradle).
lwjgl_version=3.3.1
# Which shared (loader-neutral) source tree this adapter compiles.
shared_layer=1.20.1-common
