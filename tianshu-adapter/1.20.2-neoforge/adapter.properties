# Everything that pins this adapter to one Minecraft line lives here.
# 1.20.2 is a real NeoForge line (20.2.x) that publishes no Gradle Module Metadata, so ModDevGradle cannot serve it
# and the older NeoGradle plugin does; the game still runs on Java 17 and speaks SimpleChannel networking.
minecraft_version=1.20.2
neo_version=20.2.93
java_version=17
# Which shared (loader-neutral) source tree this adapter compiles.
shared_layer=1.20.2-common
