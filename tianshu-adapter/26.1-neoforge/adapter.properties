# Everything that pins this adapter to one Minecraft line lives here.
# 26.x runs on Java 25 (the 1.21 adapters stay on 21).
# The compile target is the OLDEST patch of the line the jar claims to support (see the range keys below); a package
# that compiles against the newest and merely declares the older ones would be guessing.
minecraft_version=26.1
neo_version=26.1.0.19-beta
# What the finished jar accepts at runtime. One package covers 26.1, 26.1.1 and 26.1.2: it is built against the oldest
# of the three and declares the whole line, which is only honest as long as the source uses nothing newer. The two
# NeoForge members that were renamed between 26.1.1 and 26.1.2 are bridged by name (NeoForgeLineCompat), because no
# single source can spell both generations of a class that was deleted rather than deprecated.
minecraft_version_range=[26.1,26.2)
neo_version_range=[26.1.0,26.2.0)
java_version=25
# Which shared (loader-neutral) source tree this adapter compiles.
shared_layer=26.1-common
