# Everything that pins this adapter to one Minecraft line lives here.
# 1.20.1 is the pre-1.20.5 generation: Minecraft is still obfuscated, so the adapter remaps with Mojang's official
# mappings, and the game targets Java 17 (the repo default is 21, which belongs to the 1.20.5+ line).
minecraft_version=1.20.1
fabric_loader_version=0.16.14
fabric_api_version=0.92.12+1.20.1
java_version=17
# Which shared (loader-neutral) source tree this adapter compiles.
shared_layer=1.20.1-common
