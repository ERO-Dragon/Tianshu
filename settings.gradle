pluginManagement {
    repositories {
        // Fabric first: the NeoForged mirror can abort a request instead of returning "not found", and Gradle
        // stops at the first repository that throws rather than trying the next one.
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        // NeoGradle (the plugin line that serves NeoForge 20.2) has a classpath dependency that only the Forge
        // maven and the Mojang libraries host publish.
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://libraries.minecraft.net/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Tianshu'

