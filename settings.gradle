pluginManagement {
    repositories {
        // Fabric first: the NeoForged mirror can abort a request instead of returning "not found", and Gradle
        // stops at the first repository that throws rather than trying the next one.
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Tianshu'

include 'tianshu-api'
include 'tianshu-core'
include 'tianshu-testkit'
include 'tianshu-intake'
include 'tianshu-echo'
include 'tianshu-weaving'
include 'tianshu-auxilium'
include 'tianshu-presence'
include 'tianshu-client'
include 'tianshu-adapter:1.21-1.21.1-neoforge'
include 'tianshu-adapter:1.21-1.21.1-fabric'
include 'tianshu-adapter:1.21.2-fabric'
include 'tianshu-adapter:1.21.3-fabric'
include 'tianshu-adapter:1.21.4-fabric'
include 'tianshu-adapter:1.21.4-neoforge'
