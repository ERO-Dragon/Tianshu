pluginManagement {
    repositories {
        // Fabric first: the NeoForged mirror can abort a request instead of returning "not found", and Gradle
        // stops at the first repository that throws rather than trying the next one.
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        // NeoGradle (the plugin line that serves NeoForge 20.2) has a classpath dependency that only the Forge
        // maven and the Mojang libraries host publish.
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://libraries.minecraft.net/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Tianshu'

include 'tianshu-api'
project(':tianshu-api').projectDir = file('../Tianshu-ferry/tianshu-api')
include 'tianshu-core'
project(':tianshu-core').projectDir = file('../Tianshu-ferry/tianshu-core')
include 'tianshu-testkit'
project(':tianshu-testkit').projectDir = file('../Tianshu-ferry/tianshu-testkit')
include 'tianshu-intake'
project(':tianshu-intake').projectDir = file('../Tianshu-features/tianshu-intake')
include 'tianshu-echo'
project(':tianshu-echo').projectDir = file('../Tianshu-features/tianshu-echo')
include 'tianshu-weaving'
project(':tianshu-weaving').projectDir = file('../Tianshu-features/tianshu-weaving')
include 'tianshu-auxilium'
project(':tianshu-auxilium').projectDir = file('../Tianshu-features/tianshu-auxilium')
include 'tianshu-presence'
project(':tianshu-presence').projectDir = file('../Tianshu-features/tianshu-presence')
include 'tianshu-client'
project(':tianshu-client').projectDir = file('../Tianshu-ferry/tianshu-client')
// Dev-only arbitration bench; never packaged by an adapter and not part of `featureModules`.
include 'tianshu-lab'
project(':tianshu-lab').projectDir = file('../Tianshu-features/tianshu-lab')

// One project per shipped Minecraft version. The shared `*-common` trees are not projects: each adapter compiles
// the tree its `shared_layer` property names, so this list is the build surface and `verifyAdapterMatrixCoverage`
// checks it against the shipped matrix. Adding a version means adding its directory and this line.
include 'tianshu-adapter:1.21.7-fabric'
include 'tianshu-adapter:1.21.7-neoforge'
