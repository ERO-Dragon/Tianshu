pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Tianshu'

include 'tianshu-api'
include 'tianshu-core'
include 'tianshu-testkit'
include 'tianshu-intake'
include 'tianshu-echo'
include 'tianshu-weaving'
include 'tianshu-auxilium'
include 'tianshu-client'
include 'tianshu-neoforge'
