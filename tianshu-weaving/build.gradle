plugins {
    id 'java-library'
}

version = mod_version
group = mod_group_id

java.toolchain.languageVersion = JavaLanguageVersion.of((findProperty('java_version') ?: '21') as int)

repositories {
    mavenCentral()
}

dependencies {
    api project(':tianshu-core')
    compileOnly project(':tianshu-presence')
    compileOnly fileTree('../libs') { include 'tianshu_libs-*.jar' }
    compileOnly 'com.google.code.gson:gson:2.10.1'
    compileOnly 'org.apache.commons:commons-compress:1.26.0'
    testImplementation project(':tianshu-testkit')
    testImplementation project(':tianshu-presence')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.apache.commons:commons-compress:1.26.0'
    testImplementation fileTree('../libs') { include 'tianshu_libs-*.jar' }
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.9'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

// jjml arrives as a jarJar nested jar inside tianshu_libs; tests need it unpacked on the classpath.
def extractTianshuLibsJarJar = tasks.register('extractTianshuLibsJarJar', Sync) {
    def libsJars = fileTree('../libs') { include 'tianshu_libs-*.jar' }
    from(libsJars.collect { zipTree(it) }) {
        include 'META-INF/jarjar/*.jar'
        eachFile { details -> details.path = details.name }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir('extracted/tianshu-libs-jarjar')
}

test {
    dependsOn extractTianshuLibsJarJar
    classpath = files(fileTree(layout.buildDirectory.dir('extracted/tianshu-libs-jarjar')) { include '*.jar' }) + classpath
}

// ---------------------------------------------------------------- mod packaging
// This module ships as its own mod jar. It keeps no platform code: the manifest below is the only
// thing that makes it a mod, and the core declares it as a dependency from there.
// Values are resolved here, at configuration time, so the closure never touches the project object.
def tianshuModVersion = providers.gradleProperty('mod_version').get()
def tianshuMcRange = providers.gradleProperty('minecraft_version_range').get()
def tianshuLibsRange = providers.gradleProperty('tianshu_libs_version_range').get()
def tianshuModName = providers.gradleProperty('mod_name').get()
def tianshuMcRangeFabric = providers.gradleProperty('minecraft_version_range_fabric').get()

processResources {
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(
                mod_version               : tianshuModVersion,
                minecraft_version_range   : tianshuMcRange,
                tianshu_libs_version_range: tianshuLibsRange,
                mod_name                  : tianshuModName
        )
    }
    filesMatching('fabric.mod.json') {
        expand(
                mod_version                  : tianshuModVersion,
                mod_name                     : tianshuModName,
                minecraft_version_range_fabric: tianshuMcRangeFabric
        )
    }
}

jar {
    archiveBaseName = 'tianshu_weaving'
}

// ---------------------------------------------------------------- loader entrypoints
// Two empty classes, one per loader, outside src/main so the platform-free gate still covers only
// business code. The jar carries both manifests, which is what makes it universal.
// fabricmc has to come first: the neoforged mirror resets connections here and Gradle stops at the
// first repository that throws instead of trying the next one.
repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.neoforged.net/releases' }
}

sourceSets {
    neoforgeStubs {
        java.srcDir 'src/neoforgeStubs'
    }
    neoforgeEntry {
        java.srcDir 'src/neoforgeEntry/java'
        compileClasspath += sourceSets.main.output + sourceSets.neoforgeStubs.output
        compileClasspath += project(":tianshu-api").sourceSets.main.output
    }
    fabricEntry {
        java.srcDir 'src/fabricEntry/java'
        compileClasspath += sourceSets.main.output
        compileClasspath += project(":tianshu-api").sourceSets.main.output
    }
}

// Resolved here, at configuration time: the jar closure must not touch the project object.
def neoforgeEntryOutput = sourceSets.neoforgeEntry.output
def fabricEntryOutput = sourceSets.fabricEntry.output

dependencies {
    fabricEntryCompileOnly "net.fabricmc:fabric-loader:${fabric_loader_version}"
}

jar {
    from neoforgeEntryOutput
    from fabricEntryOutput
}
