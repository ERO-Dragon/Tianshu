# Read by NeoForge 1.20.1-1.20.3 (legacy FML). FML 10+ reads META-INF/neoforge.mods.toml instead.
# The loader dependency is deliberately absent: this single file is read by 1.20.1's `forge` and by
# 1.20.2/1.20.3's `neoforge`, so naming either one would fail on the other line.

modLoader="javafml"
loaderVersion="[1,)"
license="MIT"

[[mods]]
modId="tianshu_presence"
version="${mod_version}"
displayName="${mod_name} - Presence"
description='''
In-game presence HUD for Tianshu: the product state, the status line and the dialogue partner marker.
'''
displayTest="IGNORE_SERVER_VERSION"

[[dependencies.tianshu_presence]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range_legacy}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.tianshu_presence]]
    modId="tianshu"
    mandatory=true
    versionRange="[1.0.0,2.0.0)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.tianshu_presence]]
    modId="tianshu_libs"
    mandatory=true
    versionRange="${tianshu_libs_version_range}"
    ordering="AFTER"
    side="CLIENT"
