modLoader="javafml"
loaderVersion="[1,)"
license="MIT"

[[mods]]
modId="tianshu_presence"
version="${mod_version}"
displayName="${mod_name} - Presence"
description='''
In-game presence HUD for Tianshu: the product state, the status line and the dialogue partner marker.
'''
displayTest="IGNORE_SERVER_VERSION"

[[dependencies.tianshu_presence]]
    modId="neoforge"
    type="required"
    versionRange="[1,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.tianshu_presence]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.tianshu_presence]]
    modId="tianshu"
    type="required"
    versionRange="[${mod_version},)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.tianshu_presence]]
    modId="tianshu_libs"
    type="required"
    versionRange="${tianshu_libs_version_range}"
    ordering="AFTER"
    side="CLIENT"
