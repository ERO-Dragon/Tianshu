modLoader="javafml"
loaderVersion="[1,)"
license="MIT"

[[mods]]
modId="tianshu_lab"
version="${mod_version}"
displayName="${mod_name} - Lab"
logoFile="icon.png"
description='''
Development-only dialogue participants for exercising Intake's arbitration.
'''
displayTest="IGNORE_ALL_VERSION"

[[dependencies.tianshu_lab]]
    modId="neoforge"
    type="required"
    versionRange="[1,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.tianshu_lab]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.tianshu_lab]]
    modId="tianshu"
    type="required"
    versionRange="[1.0.0,2.0.0)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.tianshu_lab]]
    modId="tianshu_intake"
    type="required"
    versionRange="[1.0.0,2.0.0)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.tianshu_lab]]
    modId="tianshu_libs"
    type="required"
    versionRange="${tianshu_libs_version_range}"
    ordering="AFTER"
    side="CLIENT"