modLoader="javafml"
loaderVersion="[1,)"
license="LGPL-3.0"

[[mods]]
modId="tianshu_lab"
version="${mod_version}"
displayName="${mod_name} - Lab"
iconFile="icon.png"
description='''
Development-only dialogue participants for exercising Intake's arbitration.
'''

[[dependencies.tianshu_lab]]
    modId="neoforge"
    type="required"
    versionRange="[1,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.tianshu_lab]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.tianshu_lab]]
    modId="tianshu_ferry"
    type="required"
    versionRange="[1.0.0,2.0.0)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.tianshu_lab]]
    modId="tianshu_intake"
    # Optional on purpose: the bench can be launched alone (kernel + bench), and the dialogue participants it
    # registers only exist when Intake's arbitration is installed to receive them.
    type="optional"
    versionRange="[1.0.0,2.0.0)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.tianshu_lab]]
    modId="tianshu_foundry"
    type="required"
    versionRange="${tianshu_foundry_version_range}"
    ordering="AFTER"
    side="CLIENT"