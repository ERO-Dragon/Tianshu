plugins {
    id 'java-library'
}

version = mod_version
group = mod_group_id

java.toolchain.languageVersion = JavaLanguageVersion.of((findProperty('java_version') ?: '21') as int)

repositories {
    mavenCentral()
}

dependencies {
    api project(':tianshu-api')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
