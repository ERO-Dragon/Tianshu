plugins {
    id 'java-library'
}

version = mod_version
group = mod_group_id

java.toolchain.languageVersion = JavaLanguageVersion.of((findProperty('java_version') ?: '21') as int)

repositories {
    mavenCentral()
}

dependencies {
    api project(':tianshu-api')
    api project(':tianshu-intake')
    api project(':tianshu-echo')
    api project(':tianshu-weaving')
    api project(':tianshu-auxilium')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Test doubles only: this module is never published and never packaged.
tasks.named('jar') {
    enabled = false
}
