modLoader="javafml"
loaderVersion="[1,)"
license="MIT"

[[mods]]
modId="tianshu_intake"
version="${mod_version}"
displayName="${mod_name} - Intake"
logoFile="icon.png"
description='''
Speech intake for Tianshu: recognition, then repair of misheard words.
'''
displayTest="IGNORE_SERVER_VERSION"

[[dependencies.tianshu_intake]]
    modId="neoforge"
    type="required"
    versionRange="[1,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.tianshu_intake]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.tianshu_intake]]
    modId="tianshu_ferry"
    type="required"
    versionRange="[1.0.0,2.0.0)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.tianshu_intake]]
    modId="tianshu_foundry"
    type="required"
    versionRange="${tianshu_foundry_version_range}"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.tianshu_intake]]
    modId="tianshu_presence"
    type="required"
    versionRange="[${mod_version},)"
    ordering="NONE"
    side="CLIENT"
